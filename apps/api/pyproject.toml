[project]
name = "alamode-api"
version = "1.0.0"
description = "À la Mode — outfit recommendation API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.1.3",
    "alembic==1.20.0",
    "asyncpg==0.31.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyjwt[crypto]==2.15.1",
    "argon2-cffi==25.1.0",
    "httpx==0.28.1",
    "slowapi==0.1.10",
    "boto3==1.43.108",
    "python-multipart==0.0.32",
    "pillow==12.3.0",
    "structlog==26.1.0",
    "email-validator==2.3.0",
    "redis==8.1.0",
    "sentry-sdk==2.71.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "aiosqlite==0.22.1",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "freezegun==1.5.5",
    "bandit==1.9.4",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "ASYNC", "RUF"]
ignore = ["S101", "B008"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
plugins = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
