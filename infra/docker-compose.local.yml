name: dressly-local
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dressly_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Generate local configuration first}
      POSTGRES_DB: dressly
    ports: ["127.0.0.1:15432:5432"]
    volumes:
      - dressly_postgres:/var/lib/postgresql/data
      - ../.local/init-db.sql:/docker-entrypoint-initdb.d/10-application-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dressly_admin -d dressly"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Generate local configuration first}"]
    ports: ["127.0.0.1:16379:6379"]
    security_opt: ["no-new-privileges:true"]
volumes:
  dressly_postgres:
